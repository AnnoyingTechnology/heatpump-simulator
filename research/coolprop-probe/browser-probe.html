<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CoolProp browser feasibility probe</title>
<style>body{font:15px system-ui;margin:2rem;max-width:1100px}pre{white-space:pre-wrap}</style>
<h1>CoolProp browser feasibility probe</h1>
<p>Synthetic states for research. This page is separate from the interface mockup.</p>
<pre id="result">Initialising local WebAssembly…</pre>
<script type="module">
import { runProbe } from './probe-common.mjs';
try {
  window.probeResult = await runProbe();
  document.querySelector('#result').textContent = JSON.stringify(window.probeResult, null, 2);
} catch (error) {
  window.probeError = String(error);
  document.querySelector('#result').textContent = String(error);
}
</script>
</html>
